services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "60081:8000"
    environment:
      PYTHONPATH: /app
    volumes:
      - ${CREATOR_SN_DATA_DIR:-./backend}/db:/app/db
      - ${CREATOR_SN_DATA_DIR:-./backend}/backup:/app/backup
      - ${CREATOR_SN_DATA_DIR:-./backend}/member_cv:/app/member_cv
      - ${CREATOR_SN_DATA_DIR:-./backend}/products:/app/products
      - ${CREATOR_SN_DATA_DIR:-./backend}/projects:/app/projects
      - ${CREATOR_SN_DATA_DIR:-./backend}/resume_images:/app/resume_images
      - ${CREATOR_SN_DATA_DIR:-./backend}/user:/app/user
    restart: unless-stopped
